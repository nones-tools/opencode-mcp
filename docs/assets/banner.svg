<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">OpenCode MCP</title>
  <desc id="bannerDesc">OpenCode MCP banner: the Nones pixel octopus beside the title OpenCode MCP, an MCP server, CLI and SDK for an already running OpenCode 2 service.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050a24"/>
      <stop offset="0.55" stop-color="#070c2a"/>
      <stop offset="1" stop-color="#0a1033"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#9023e6" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#4b1780" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050a24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="272" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39b4ac" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#9023e6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#39b4ac" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2350" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="0"/>
    </clipPath>
    <clipPath id="avatarClip">
      <rect x="68" y="72" width="168" height="176" rx="26"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <g opacity="0.30">
      <rect width="1200" height="320" fill="url(#grid)"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#1e2854"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g>
      <rect x="68" y="72" width="168" height="176" rx="26" fill="#060b26" stroke="#3a2a72"/>
      <image x="68" y="72" width="168" height="176" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" href="data:image/png;base64,"/>
      <rect x="68" y="72" width="168" height="176" rx="26" fill="none" stroke="#39b4ac" stroke-opacity="0.35"/>
    </g>
    <g transform="translate(272 44)">
      <rect width="168" height="32" rx="16" fill="#0c1338" stroke="#2b3670"/>
      <circle cx="18" cy="16" r="4" fill="#39b4ac"/>
      <text x="32" y="21" font-size="12" font-weight="700" letter-spacing="2.4" fill="#dce6ff">NONES TOOLS</text>
    </g>
    <text x="462" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3.2" fill="#39b4ac">SESSIONS</text>
    <text x="1128" y="65" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" letter-spacing="0.5" fill="#8d9ac0">@nones/opencode-mcp</text>
    <text x="270" y="154" font-size="66" font-weight="700" letter-spacing="-1.8" fill="#f6f3ff">OpenCode MCP</text>
    <text x="274" y="190" font-size="19" fill="#a9b4d4">MCP server, CLI and SDK for an already running OpenCode 2 service</text>
    <path d="M272 218H1128" stroke="url(#rule)" stroke-width="1.5"/>
    <text x="272" y="248" font-size="11.5" font-weight="600" letter-spacing="2.2" fill="#7b87ad">SESSIONS  ·  MONITORING  ·  OPERATION JOURNAL</text>
    <text x="1128" y="278" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.2" fill="#5f6a91">NONES-TOOLS/NONES-MCP/APPS/OPENCODE</text>
  </g>
</svg>
